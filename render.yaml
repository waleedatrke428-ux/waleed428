services:
  - type: web
    name: crypto-balhousi-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
