name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check administration dashboard JavaScript
        run: node --check admin/app.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend signal logic
        working-directory: server
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name cloud_mobile_starter --org com.example --no-pub .

      - name: Block Android screenshots and screen recording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Android MainActivity.kt, found {len(matches)}")
          activity = matches[0]
          package = re.search(r"^package\s+([\w.]+)", activity.read_text(), re.MULTILINE)
          if package is None:
              raise SystemExit(f"Could not read Android package from {activity}")
          activity.write_text(f'''package {package.group(1)}

          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.TimeZone

          class MainActivity : FlutterActivity() {{
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  window.setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_SECURE,
                      android.view.WindowManager.LayoutParams.FLAG_SECURE
                  )
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "cloud_mobile_starter/device")
                      .setMethodCallHandler {{ call, result ->
                          if (call.method == "timezoneId") {{
                              result.success(TimeZone.getDefault().id)
                          }} else {{
                              result.notImplemented()
                          }}
                      }}
              }}
          }}
          ''')
          PY

      - name: Set Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle.kts")
          content = gradle_file.read_text()
          template_value = "minSdk = flutter.minSdkVersion"
          if content.count(template_value) != 1:
              raise SystemExit(
                  f"Expected one generated minSdk setting in {gradle_file}"
              )
          gradle_file.write_text(content.replace(template_value, "minSdk = 21"))
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://waleed.freehosting.dev' }}
        run: flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: waleed428-signals-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
