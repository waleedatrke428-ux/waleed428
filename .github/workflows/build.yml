name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name cloud_mobile_starter --org com.example --no-pub .

      - name: Set Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle.kts")
          content = gradle_file.read_text()
          template_value = "minSdk = flutter.minSdkVersion"
          if content.count(template_value) != 1:
              raise SystemExit(
                  f"Expected one generated minSdk setting in {gradle_file}"
              )
          gradle_file.write_text(content.replace(template_value, "minSdk = 21"))
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-mobile-starter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
